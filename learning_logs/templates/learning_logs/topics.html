<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Log</title>
</head>
<body>
    {% extends "learning_logs/base.html" %}
    {% block content %}
        <h2>This is the page about topics</h2>
        <ul>
            {% for topic in topics %}
                <li> <a href="{% url 'learning_logs:topic' topic.id %}">{{ topic }}</a></li>
            {% empty %}
                <p>No topics</p>
            {% endfor %}
        </ul>
    {% endblock content%}
</body>
</html>
